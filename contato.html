<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contato | PixelVerse</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>🎮 PixelVerse</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>


    <main>

        <section class="introducao">

            <p class="tag">FALE CONOSCO</p>

            <h2>Entre em contato</h2>

            <p>
                Envie uma mensagem para o projeto PixelVerse.
            </p>

        </section>


        <section id="destaques">

            <p class="tag">FORMULÁRIO</p>

            <h2>Envie sua mensagem</h2>


            <form>

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="assunto">
                        Assunto
                    </label>

                    <input
                        type="text"
                        id="assunto"
                        name="assunto"
                        placeholder="Digite o assunto"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="mensagem">
                        Mensagem
                    </label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="7"
                        placeholder="Digite sua mensagem"
                        required
                    ></textarea>

                </div>


                <button type="submit" class="botao">
                    Enviar mensagem
                </button>

            </form>

        </section>


        <section class="curiosidade">

            <h2>🎮 PixelVerse</h2>

            <p>
                Este formulário é apenas uma demonstração.
                Ele não envia mensagens reais.
            </p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 PixelVerse — Projeto acadêmico
        </p>

    </footer>

</body>

</html>
